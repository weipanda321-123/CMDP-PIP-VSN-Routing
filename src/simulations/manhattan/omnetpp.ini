description = "G5: SAF + PIP/CMDP (Optics Valley)"
*.node[*].appl.enableDN = false
*.node[*].appl.enableSAF = true
*.node[*].appl.cmdpPolicyMode = "LagrangianGreedy"
*.node[*].appl.cmdpUsePIP = true

[Config Ch6-OV-G6-DN-PIP]
extends = Ch6-OV-Base
description = "G6: DN + PIP/CMDP (Optics Valley)"
