*.node[*].appl.enableSAF = false
*.node[*].appl.cmdpPolicyMode = "LagrangianGreedy"
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.dnPa = 0.5
*.node[*].appl.dnKmax = 20
*.node[*].appl.dnUpdateInterval = 2s

[Config Ch6-OV-G7-Full]
extends = Ch6-OV-Base
