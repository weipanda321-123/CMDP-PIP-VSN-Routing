[General]

##########################################################
#  802.11p 完整配置 (从 DN 验证过的配置复制)               #
##########################################################
*.node[*].nic.phy80211p.sensitivity = -89dBm
*.node[*].nic.phy80211p.maxTXPower = 20mW
*.node[*].nic.phy80211p.txPower = 20mW
*.node[*].nic.phy80211p.useThermalNoise = true
*.node[*].nic.phy80211p.thermalNoise = -110dBm
*.node[*].nic.phy80211p.decider = xmldoc("config.xml")
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.minPowerLevel = -110dBm
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -98dBm
*.node[*].nic.phy80211p.antennaOffsetX = 0 m
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
*.node[*].nic.phy80211p.antennaOffsetYaw = 0 rad
*.node[*].nic.mac1609_4.useSCH = false
*.node[*].nic.mac1609_4.txPower = 20mW
*.node[*].nic.mac1609_4.bitrate = 6Mbps
*.node[*].nic.mac1609_4.useAcks = false
*.node[*].nic.mac1609_4.ackTimeout = 250ms

cmdenv-express-mode = true
cmdenv-autoflush = true
ned-path = .
network = CMDPNetwork

##########################################################
#            Simulation Timing                            #
##########################################################
sim-time-limit = 1500s
warmup-period = 20s
**.scalar-recording = true
**.vector-recording = true
seed-set = ${repetition}

##########################################################
#            Playground (2km x 2km, Table 1)              #
##########################################################
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

##########################################################
#            Connection Manager                           #
##########################################################
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.sendDirect = true
*.connectionManager.coreDebug = false

##########################################################
#            TraCI / SUMO                                 #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""
*.manager.autoShutdown = true
*.manager.margin = 25
*.manager.launchConfig = xmldoc("manhattan.launchd.xml")

##########################################################
#            Obstacles                                    #
##########################################################
*.obstacles.debug = false
#*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

*.annotations.draw = false

##########################################################
#  802.11p / ITS-G5 NIC (Table 1: 5.9GHz, 6Mbps, 20dBm) #
##########################################################
*.node[*].nicType = "org.car2x.veins.modules.nic.Nic80211p"

# PHY layer
#REPLACED# *.node[*].nic.phy80211p.sensitivity = -89dBm
#REPLACED# *.node[*].nic.phy80211p.maxTXPower = 20mW
#REPLACED# *.node[*].nic.phy80211p.txPower = 20mW
#REPLACED# *.node[*].nic.phy80211p.useThermalNoise = true
#REPLACED# *.node[*].nic.phy80211p.thermalNoise = -110dBm
#REPLACED# *.node[*].nic.phy80211p.decider = xmldoc("config.xml")
#REPLACED# *.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
#REPLACED# *.node[*].nic.phy80211p.antenna = xmldoc("config.xml", "//AnalogueModel[@type='AntennaModel']/owner/owner/antenna")
#REPLACED# *.node[*].nic.phy80211p.minPowerLevel = -110dBm
#REPLACED# *.node[*].nic.phy80211p.useNoiseFloor = true
#REPLACED# *.node[*].nic.phy80211p.noiseFloor = -98dBm

# MAC layer - MUST disable SCH for unicast (SAF lesson)
#REPLACED# *.node[*].nic.mac1609_4.useServiceChannel = false
#REPLACED# *.node[*].nic.mac1609_4.useSCH = false
#REPLACED# *.node[*].nic.mac1609_4.txPower = 20mW
#REPLACED# *.node[*].nic.mac1609_4.bitrate = 6Mbps
#REPLACED# *.node[*].nic.mac1609_4.useAcks = false
#REPLACED# *.node[*].nic.mac1609_4.ackTimeout = 250ms

##########################################################
#            Application Layer (CMDPApp)                   #
##########################################################
*.node[*].applType = "CMDPApp"
*.node[*].appl.headerLength = 80bit

# ---- CMDP Routing ----
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.cmdpUseGNN = false
*.node[*].appl.cmdpPolicyMode = "LagrangianGreedy"
*.node[*].appl.enableDN = false
*.node[*].appl.enableSAF = false

# ---- Trust Model (Eq.11-14) ----
*.node[*].appl.trustAlpha1 = 0.5
*.node[*].appl.trustAlpha2 = 0.5
*.node[*].appl.trustThresholdPth = 0.1
*.node[*].appl.lagrangianLambda = 1.0
*.node[*].appl.etaLambda = 0.005

# ---- Timing ----
*.node[*].appl.beaconInterval = 0.1s
*.node[*].appl.neighborTimeout = 5s
*.node[*].appl.dataGenInterval = 2s
*.node[*].appl.warmupTime = 10s
*.node[*].appl.commRange = 300m
*.node[*].appl.maxHops = 20

# ---- Scenario ----
*.node[*].appl.totalVehicles = 50
*.node[*].appl.numGroups = 3

# ---- Delay Model (Table 1) ----
*.node[*].appl.packetSizeBytes = 512
*.node[*].appl.dataRateBps = 6e6
*.node[*].appl.ackTimeS = 0.3e-3
*.node[*].appl.procTimeS = 0.1e-3
*.node[*].appl.pathLossExponent = 2.7
*.node[*].appl.sinrThresholdDB = 8
*.node[*].appl.txPowerW = 0.1
*.node[*].appl.noisePowerW = 1e-10
*.node[*].appl.antennaGainLinear = 1.0

# ---- Logging ----
*.node[*].appl.enableCSVLog = true
*.node[*].appl.csvLogPath = "cmdp_log.csv"
*.node[*].appl.gnnTrainingDataPath = "gnn_training_data.csv"

# ---- Mobility ----
#*.node[*].mobilityType = "org.car2x.veins.modules.mobility.traci.TraCIMobility"
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 1.895

##########################################################
#    ABLATION & SWEEP CONFIGURATIONS                     #
##########################################################

# ---- CMDP + PIP (default) ----
[Config CMDP-PIP]
description = "CMDP with PIP masking (proposed method)"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.cmdpPolicyMode = "LagrangianGreedy"

# ---- CMDP without PIP (penalty only) ----
[Config CMDP-NoPIP]
description = "CMDP without PIP (Lagrangian penalty only)"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpPolicyMode = "LagrangianGreedy"

# ---- CMDP + PIP + GNN ----
[Config CMDP-PIP-GNN]
description = "CMDP with PIP + GNN + PPO neural policy"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.cmdpUseGNN = true
*.node[*].appl.cmdpPolicyMode = "RLPolicy"

# ---- CMDP + PIP + DN + SAF ----
[Config CMDP-Full]
description = "Full integration with DN and SAF"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.enableDN = true
*.node[*].appl.enableSAF = true

# ---- Exact label-setting baseline ----
[Config CMDP-Exact]
description = "Exact RCSPP label-setting (baseline)"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpPolicyMode = "ExactBaseline"

# ---- Control group: no CMDP ----
[Config NoCMDP]
description = "No CMDP routing (control group)"
*.node[*].appl.enableCMDP = false

# ---- Vehicle density sweep (Table 1: 5-50) ----
[Config DensitySweep]
description = "Sweep vehicle density"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.totalVehicles = ${nveh=10, 20, 30, 40, 50}
# Note: generate_sumo_network.py must be run separately for each density

# ---- Trust threshold sweep ----
[Config TrustSweep]
description = "Sweep trust threshold P_th"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.trustThresholdPth = ${pth=0.01, 0.05, 0.1, 0.2, 0.5}

# ---- Lambda sweep ----
[Config LambdaSweep]
description = "Sweep Lagrangian multiplier lambda"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.lagrangianLambda = ${lambda=0.1, 0.5, 1.0, 2.0, 5.0, 10.0}

# ---- 补全 PHY 缺失参数 (Veins 5.2 必需) ----
#REPLACED# *.node[*].nic.phy80211p.usePropagationDelay = true
#REPLACED# *.node[*].nic.phy80211p.antenna = xmldoc("config.xml", "//AnalogueModel[@type='AntennaModel']//owner//owner//antenna")
#REPLACED# *.node[*].nic.phy80211p.antennaOffsetX = 0 m
#REPLACED# *.node[*].nic.phy80211p.antennaOffsetY = 0 m
#REPLACED# *.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m
#REPLACED# *.node[*].nic.phy80211p.antennaOffsetYaw = 0 rad

# ---- 补全 MAC 缺失参数 ----
#REPLACED# *.node[*].nic.mac1609_4.txPower = 20mW
#REPLACED# *.node[*].nic.mac1609_4.bitrate = 6Mbps

# ---- applType 必须在 Car 里正确指定 ----
*.node[*].applType = "CMDPApp"
*.node[*].appl.headerLength = 80bit

# ---- CMDP + PPO (RLPolicy via TCP server) ----
[Config CMDP-PPO]
description = "CMDP with PPO neural policy (requires ppo_inference_server.py)"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.cmdpPolicyMode = "RLPolicy"
*.node[*].appl.enableDN = false
*.node[*].appl.enableSAF = false

# ---- Full: CMDP + PPO + DN + SAF ----
[Config CMDP-PPO-Full]
description = "Full integration: PPO + DN + SAF"
*.node[*].appl.enableCMDP = true
*.node[*].appl.cmdpUsePIP = true
*.node[*].appl.cmdpPolicyMode = "RLPolicy"
*.node[*].appl.enableDN = true
*.node[*].appl.enableSAF = true

# ================================================================
#  OJCOMS Baseline Configs (density sweep, added by apply_baselines.sh)
# ================================================================

[Config CMDP-DP]
description = "DP (resource-discretized) baseline"
extends = General
*.node[*].appl.cmdpPolicyMode = "DPBaseline"
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpUseGNN = false

[Config CMDP-KSP]
description = "K-Shortest Paths (Yen, K=20) baseline"
extends = General
*.node[*].appl.cmdpPolicyMode = "KSPBaseline"
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpUseGNN = false

[Config CMDP-BB]
description = "Branch and Bound with Lagrangian relaxation"
extends = General
*.node[*].appl.cmdpPolicyMode = "BranchBound"
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpUseGNN = false

[Config CMDP-GA]
description = "Genetic Algorithm (P=100, G=200)"
extends = General
*.node[*].appl.cmdpPolicyMode = "GABaseline"
*.node[*].appl.cmdpUsePIP = false
*.node[*].appl.cmdpUseGNN = false

# ============================================================
# G5: SAF + PIP/CMDP (ablation: no DN)
# ============================================================
[Config CMDP-SAF-PIP]
extends = CMDP-PIP
*.node[*].appl.enableDN = false
*.node[*].appl.enableSAF = true

# ============================================================
# G6: DN + PIP/CMDP (ablation: no SAF)
# ============================================================
[Config CMDP-DN-PIP]
extends = CMDP-PIP
*.node[*].appl.enableDN = true
*.node[*].appl.enableSAF = false

##########################################################################
# 第6章：武汉光谷真实路网通勤走廊场景
##########################################################################

[Config Ch6-OV-Base]
description = "Ch6 base: Optics Valley real road network (400 vehicles)"
sim-time-limit = 200s
warmup-period = 20s
*.manager.launchConfig = xmldoc("optics_valley_commuter_launchd.xml")
# Optics Valley road network is ~2km x 2km, SUMO coords up to ~5000
*.playgroundSizeX = 6000m
*.playgroundSizeY = 6000m
*.playgroundSizeZ = 50m
*.node[*].appl.ablationShuffleSocial = false
*.node[*].appl.ablationNoSelfish = false
*.node[*].appl.dataGenInterval = 2s
*.node[*].appl.numDataPkts = 90
*.node[*].appl.trustBudget = 2.3
*.node[*].appl.collectDetailedStats = true

[Config Ch6-OV-G0-AODV]
extends = Ch6-OV-Base
description = "G0: AODV baseline (Optics Valley)"
*.node[*].appl.enableDN = false
*.node[*].appl.enableSAF = false
*.node[*].appl.cmdpPolicyMode = "AODV"
